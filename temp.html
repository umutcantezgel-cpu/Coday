h Informationszwecken und ersetzen keine professionelle Beratung. Wir übernehmen keine Haftung für Entscheidungen, die auf Basis von KI-Antworten getroffen werden.\"},\"gemini\":{\"content\":\"Für den Chatbot und Website-Analyzer werden Ihre Anfragen an die Google Gemini API übermittelt.\",\"title\":\"Google Gemini API\"},\"note\":\"Unser KI-Assistent \\\"Codi\\\" und der Website-Analyzer nutzen externe KI-Dienste zur Verarbeitung. Bei der Nutzung werden Ihre Eingaben an diese Dienste übermittelt.\",\"perplexity\":{\"content\":\"Für erweiterte Suchanfragen wird die Perplexity API genutzt.\",\"title\":\"Perplexity API\"},\"subtitle\":\"Einsatz von Künstlicher Intelligenz\",\"title\":\"KI-Dienste \u0026 Automatisierte Verarbeitung\"},\"5\":{\"content\":\"Wir arbeiten mit sorgfältig ausgewählten Dienstleistern zusammen, die uns bei der Erbringung unserer Leistungen unterstützen. Mit allen Auftragsverarbeitern bestehen entsprechende Verträge nach Art. 28 DSGVO.\",\"subtitle\":\"Mit wem wir zusammenarbeiten\",\"title\":\"Auftragsverarbeiter \u0026 Drittanbieter\"},\"6\":{\"content\":\"Sie haben umfassende Rechte bezüglich Ihrer personenbezogenen Daten. Zur Ausübung dieser Rechte kontaktieren Sie uns bitte unter umut@codayweb.de.\",\"subtitle\":\"Ihre Rechte nach DSGVO\",\"title\":\"Betroffenenrechte\"},\"7\":{\"content\":\"Wir setzen umfangreiche technische und organisatorische Maßnahmen ein, um Ihre Daten zu schützen:\",\"subtitle\":\"Technische und organisatorische Maßnahmen\",\"title\":\"Datensicherheit\"},\"aenderungen\":{\"subtitle\":\"Aktualisierungen und Versionierung\",\"title\":\"Änderungen dieser Datenschutzerklärung\"},\"beschwerde\":{\"subtitle\":\"Wenn Sie unzufrieden sind\",\"title\":\"Beschwerderecht bei der Aufsichtsbehörde\"},\"datenfluss\":{\"subtitle\":\"Wie Ihre Daten verarbeitet werden\",\"title\":\"Datenfluss-Übersicht\"},\"grundsaetze\":{\"subtitle\":\"Unsere Verpflichtungen nach DSGVO Art. 5\",\"title\":\"Grundsätze der Datenverarbeitung\"},\"inte
