<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#147a7a"/>
      <stop offset="100%" stop-color="#1A9A9A"/>
    </linearGradient>
  </defs>
  <!-- Coday Star Burst — minimalist 8-point star -->
  <g transform="translate(32,32)" fill="none" stroke="url(#g)" stroke-linecap="round">
    <!-- Main cardinal rays (thick) -->
    <line x1="0" y1="-4" x2="0" y2="-28" stroke-width="3"/>
    <line x1="0" y1="4" x2="0" y2="28" stroke-width="3"/>
    <line x1="-4" y1="0" x2="-28" y2="0" stroke-width="3"/>
    <line x1="4" y1="0" x2="28" y2="0" stroke-width="3"/>
    <!-- Diagonal rays (thinner, longer for asymmetry like the logo) -->
    <line x1="-3" y1="-3" x2="-22" y2="-22" stroke-width="2"/>
    <line x1="3" y1="-3" x2="20" y2="-24" stroke-width="2"/>
    <line x1="-3" y1="3" x2="-24" y2="20" stroke-width="2"/>
    <line x1="3" y1="3" x2="22" y2="22" stroke-width="2"/>
    <!-- Extra asymmetric accent rays (like the logo's organic feel) -->
    <line x1="-2" y1="-5" x2="-14" y2="-26" stroke-width="1.5"/>
    <line x1="5" y1="-2" x2="26" y2="-14" stroke-width="1.5"/>
    <line x1="-5" y1="2" x2="-26" y2="14" stroke-width="1.5"/>
    <line x1="2" y1="5" x2="14" y2="26" stroke-width="1.5"/>
  </g>
</svg>